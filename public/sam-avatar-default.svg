<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#001F3F"/>

  <!-- Inner circle highlight -->
  <circle cx="128" cy="128" r="100" fill="#0369A1" opacity="0.15"/>

  <!-- Robot head -->
  <rect x="78" y="88" width="100" height="80" rx="16" fill="#FFFFFF" opacity="0.95"/>

  <!-- Eyes -->
  <circle cx="103" cy="120" r="8" fill="#001F3F"/>
  <circle cx="153" cy="120" r="8" fill="#001F3F"/>

  <!-- Eye shine -->
  <circle cx="106" cy="117" r="3" fill="#FFFFFF"/>
  <circle cx="156" cy="117" r="3" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M108 140 Q128 155 148 140" stroke="#001F3F" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="128" y1="88" x2="128" y2="72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="128" cy="68" r="6" fill="#0369A1"/>

  <!-- Ear panels -->
  <rect x="68" y="108" width="10" height="20" rx="4" fill="#FFFFFF" opacity="0.7"/>
  <rect x="178" y="108" width="10" height="20" rx="4" fill="#FFFFFF" opacity="0.7"/>

  <!-- Bottom chin -->
  <path d="M98 168 Q128 178 158 168" stroke="#0369A1" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- SAM label -->
  <text x="128" y="210" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" opacity="0.8">SAM</text>
</svg>