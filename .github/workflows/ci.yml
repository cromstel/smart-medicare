name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify gates (sequential)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_medicare_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database (server config/database.ts reads DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME/DB_SSL)
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: smart_medicare_test
      DB_SSL: false
      # Application name (server config/app.ts requires APP_NAME; frontend vitest supplies VITE_APP_NAME)
      APP_NAME: Test Application
      VITE_APP_NAME: Test Application
      VITE_PORT: 5175
      NODE_ENV: test
    # The verification gates run sequentially, never in parallel, because the
    # frontend build and backend tests can OOM Node when run concurrently on
    # memory-constrained runners. Each step below depends on the previous one.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Seed database (schema.sql + seed.sql, re-runnable)
        run: cd server && npm run db:setup

      - name: Root verification gates (lint → type-check → vitest → tsc -b + vite build)
        run: npm run verify

      - name: Server verification gates (lint → tsc build → vitest)
        run: cd server && npm run verify
